name: stays

services:

  postgres:
    image: postgres:17-alpine
    container_name: stays-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      SERVICE_DATABASES: ${SERVICE_DATABASES}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: stays-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: stays-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: stays-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  auth-ms:
    build:
      context: ./auth-ms
      dockerfile: Dockerfile.dev
    container_name: stays-auth-ms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./auth-ms/src:/usr/src/app/src
      - ./auth-ms/prisma:/usr/src/app/prisma
      - /usr/src/app/src/generated
      - /usr/src/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: auth_queue
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}

  catalog-ms:
    build:
      context: ./catalog-ms
      dockerfile: Dockerfile.dev
    container_name: stays-catalog-ms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./catalog-ms/src:/usr/src/app/src
      - ./catalog-ms/prisma:/usr/src/app/prisma
      - /usr/src/app/src/generated
      - /usr/src/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: catalog_queue
      SEARCH_QUEUE: search_queue
      BOOKING_QUEUE: booking_queue
      REDIS_URL: redis://redis:6379

  booking-ms:
    build:
      context: ./booking-ms
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./booking-ms/src:/usr/src/app/src
      - ./booking-ms/prisma:/usr/src/app/prisma
      - /usr/src/app/src/generated
      - /usr/src/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: booking_queue
      CATALOG_QUEUE: catalog_queue
      HOLD_TTL_MINUTES: ${HOLD_TTL_MINUTES:-15}
      BOOKING_STRATEGY: ${BOOKING_STRATEGY:-atomic}

  search-ms:
    build:
      context: ./search-ms
      dockerfile: Dockerfile.dev
    container_name: stays-search-ms
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./search-ms/src:/usr/src/app/src
      - /usr/src/app/node_modules
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_QUEUE: search_queue
      CATALOG_QUEUE: catalog_queue
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      HOTELS_ALIAS: hotels

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    container_name: stays-api-gateway
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-3002}:3000"
    volumes:
      - ./api-gateway/src:/usr/src/app/src
      - /usr/src/app/node_modules
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      AUTH_QUEUE: auth_queue
      CATALOG_QUEUE: catalog_queue
      SEARCH_QUEUE: search_queue
      BOOKING_QUEUE: booking_queue
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

volumes:
  postgres-data:
  rabbitmq-data:
  elasticsearch-data:
